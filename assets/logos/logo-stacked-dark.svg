<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" role="img" aria-label="WIP: Workshop on Interpretability in Progress compact lockup, dark variant">
  <title>WIP: Workshop on Interpretability in Progress: Understanding, Forecasting, and Repairing Training — ICLR 2027 Workshop</title>
  <desc>Compact (phone) version of the horizontal lockup: the progress-ring mark beside a two-line title, with the subtitle, progress bar and venue below.</desc>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .bar-fill { animation: wip-fill 1.1s cubic-bezier(.22,.9,.3,1) both; }
      @keyframes wip-fill { from { width: 0px; } to { width: 208px; } }
    }
  </style>
  <g transform="translate(0, 0) scale(0.5)">
    <circle cx="80" cy="80" r="72" fill="none" stroke="#3c4043" stroke-width="3.5"/>
    <path d="M 17.6 116.0 A 72 72 0 1 0 139.9 40.1" fill="none" stroke="#7aa7ff" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 28 110 Q 50 102 70 88" fill="none" stroke="#7aa7ff" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 70 88 Q 100 102 130 130" fill="none" stroke="#9aa0a6" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="3.5 3.5" opacity="0.6"/>
    <path d="M 70 88 Q 105 57 137 42" fill="none" stroke="#34d399" stroke-width="2.8" stroke-linecap="round"/>
    <g transform="translate(137 42) rotate(-25.2)">
      <path d="M 0 0 L -10 -5 L -10 5 Z" fill="#34d399"/>
    </g>
    <circle cx="28" cy="110" r="4" fill="#7aa7ff"/>
    <circle cx="70" cy="88" r="7" fill="#0b0d12" stroke="#f87171" stroke-width="1.8"/>
    <circle cx="70" cy="88" r="3" fill="#f87171"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="94" y="34" font-size="20" font-weight="500" fill="#f5f1e8">Workshop on</text>
    <text x="94" y="60" font-size="20" font-weight="500" fill="#f5f1e8">Interpretability in Progress</text>
    <text x="0" y="104" font-size="15" fill="#c8c2b4">Understanding, Forecasting, and Repairing Training</text>
    <text x="0" y="124" font-size="15" fill="#c8c2b4">· <tspan font-weight="700" fill="#34d399">WIP</tspan></text>
    <rect x="0" y="136" width="400" height="5" rx="2.5" fill="#3c4043"/>
    <rect class="bar-fill" x="0" y="136" width="208" height="5" rx="2.5" fill="#34d399"/>
    <text x="0" y="162" font-size="12" fill="#8b8674" letter-spacing="1">ICLR 2027</text>
